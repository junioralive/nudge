name: Nudge CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --omit=dev
      - name: Check for local secrets and databases
        run: |
          ! find . -path './node_modules' -prune -o -type f \( -name '.dev.vars' -o -name '.env' -o -name '*.db' -o -name '*.pem' -o -name 'NUDGE_LOGIN_KEY.txt' \) -print -quit | grep -q .
